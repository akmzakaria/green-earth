<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="card-container">

    </div>

    <!-- History container -->
    <div id="history-container" class="mt-5 bg-gray-100 p-3 rounded">
        <h3 class="font-bold">History</h3>
        <ul id="history-list"></ul>

        <!-- Total section -->
        <div class="flex justify-between font-bold mt-3">
            <span>Total:</span>
            <span id="total-price">0</span>
        </div>
    </div>

    <script>
        let total = 0; // keep track of total

        const loadTrees = () => {
            fetch('https://openapi.programming-hero.com/api/plants')
                .then(res => res.json())
                .then(data => displayTree(data.plants))
        }

        loadTrees();

        const displayTree = (plants) => {
            const cardContainer = document.getElementById('card-container');
            cardContainer.innerHTML = '';

            plants.forEach(plant => {
                const card = document.createElement('div');

                card.innerHTML = `
                    <h1>${plant.name}</h1>
                    <p>${plant.price}</p>
                    <button onclick="addHistory('${plant.name}', ${plant.price})">Add To Cart</button>
                `;

                cardContainer.append(card);
            })
        }

        // Function to add history
        function addHistory(name, price) {
            const historyList = document.getElementById("history-list");

            const li = document.createElement("li");
            li.className = "flex justify-between items-center bg-white p-2 my-1 rounded";

            li.innerHTML = `
                <span>${name} - ${price}</span>
                <button onclick="removeHistory(this, ${price})" class="text-red-500">❌</button>
            `;

            historyList.appendChild(li);

            // update total
            total += price;
            updateTotal();
        }

        // Function to remove one history item
        function removeHistory(button, price) {
            button.parentElement.remove();

            // update total
            total -= price;
            updateTotal();
        }

        // Function to update total display
        function updateTotal() {
            document.getElementById("total-price").textContent = total;
        }
    </script>
</body>



</html>
