                </div>
                <a class="flex items-center gap-1 text-lg font-bold poppins text-white">

            </div>

                <ul class="menu menu-horizontal px-1 space-x-4 ">
                    <li><a href="" class=" btn-outline text-white ">About</a></li>
                    <li><a href="" class=" btn-outline btn-primary text-white">Gallery</a>
                    </li>
                    <li><a href="" class=" btn-outline  text-white">Plant a Tree</a></li>
                </ul>
            </div>

            <div class="navbar-end">
                <button class="text-[#15803d] bg-[#facc15] rounded-full   inter font-medium btn shadow-none">Plant

            </div>

            <img class="size-1/5" src="./assets/hero-leaf1.png" alt="">

                <p class="text-center text-[#1F2937] inter">Join our mission to plant 1 million trees and make the Earth
                    greener for future
                    generations.</p>
                <button class="text-[#15803d] bg-[#facc15] rounded-full   inter font-medium btn shadow-none">Get
                    Involved</button>
            </div>

            <img class="size-1/5" src="./assets/hero-leaf2.png" alt="">

        <h1 class="text-center font-bold text-[2rem] bg-[#f0fdf4] pt-5">Choose Your Trees</h1>

        <section class="flex justify-between items-stretch p-5 bg-[#f0fdf4]">



            <div>
                <h2 class="font-bold text-[1.2rem] text-center mb-2">Catagories</h2>


                <div>

                    <button id="catagory-btn" onclick="loadCataTree1()"
                        class="btn catagory-btn hover:bg-[#15803d] hover:text-white w-50 bg-[#f0fdf4] mb-1">

                    </button>

                    <div id="cata-container" class="flex flex-col gap-1 ">

                    </div>
                </div>

            </div>

            <div id="tree-container" class="grid grid-cols-3 gap-1">

            </div>

                <h3 class="font-bold">Your Cart</h3>
                <div id="cart-container" class=" flex justify-between gap-10 items-center bg-[#f0fdf4] px-5 py-1">
                    <div class="">

                        <p>500 ⅹ 1</p>
                    </div>
                    <p>ⅹ</p>
                </div>

                <div class="flex justify-between items-center">
